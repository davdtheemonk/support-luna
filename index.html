<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Support — Luna</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #fcf3e3;
    --blob: #f8e9cc;
    --ink: #2c2418;
    --ink-soft: #6b6152;
    --rule: #e6d9bf;
    --leaf: #2f8f5b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--ink);
    font-family: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .backdrop {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -1;
    pointer-events: none;
  }
  .blob { position: absolute; border-radius: 50%; background: var(--blob); }
  .blob--tl { top: -160px; left: -160px; width: 300px; height: 300px; }
  .blob--br { bottom: -180px; right: -180px; width: 340px; height: 340px; }

  main {
    max-width: 440px;
    width: 100%;
    padding: 24px;
    text-align: center;
  }

  .wordmark {
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--leaf);
    margin-bottom: 28px;
  }

  h1 {
    font-weight: 800;
    font-size: clamp(28px, 6vw, 36px);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
  }

  p {
    font-size: 16px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin: 0 0 32px;
  }

  .contact-card {
    background: #ffffff;
    border: 1px solid var(--rule);
    border-radius: 18px;
    padding: 26px 24px;
  }

  .label {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }

  .email {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 20px;
    word-break: break-word;
  }

  a.button {
    display: inline-block;
    background: var(--leaf);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 13px 26px;
    border-radius: 12px;
  }

  .hint {
    margin-top: 18px;
    font-size: 13px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="blob blob--tl"></div>
  <div class="blob blob--br"></div>
</div>

<main>
  <div class="wordmark">Luna</div>
  <h1>Need help?</h1>
  <p>We usually reply within a day or two. Tell us what's going on and we'll sort it out.</p>

  <div class="contact-card">
    <div class="label">Email us below</div>
  
    <a class="button" href="mailto:parishniclaus@gmail.com?subject=Luna%20Support">
      Email support
    </a>
    <p class="hint">Or copy the address above into your mail app.</p>
  </div>
</main>

</body>
</html>
